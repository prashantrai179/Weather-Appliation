<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather_app</title>
    <link rel="stylesheet" href="Style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <div class="card">
        <div class="search">
            <input type="text" placeholder="Enter the city name" spellcheck="false">
            <button id="search_button"><i class="fa-solid fa-magnifying-glass"></i></button>
        </div>
        <div class="error">
            <p>Invalid city name</p>
        </div>
        <div class="weather">
            <img class="weather_icon" src="images/10d.K7j-dNbc.svg" >
            <h1 class="temp">25°c</h1>
            <h1 class="city">Indore</h1>
            <div class="details">
                <div class="col">
                    <img src="images/humidity.webp">
                    <div>
                        <p class="humidity">50%</p>
                        <p>humidity</p>
                    </div>
                </div>
                <div class="col">
                    <img src="images/wind-icon-2-white.png">
                    <div>
                        <p class="wind">16km/h</p>
                        <p>Wind Speed</p>
                    </div>
                </div>
            </div>
        </div>
            
            
    </div>

    <script>
        const apiKey = "bc0bd99d0d8faa069225734f8858e4b0";
        const apiUrl = "https://api.openweathermap.org/data/2.5/weather?units=metric&q=";;

        const searchBox = document.querySelector(".search input");
        const searchBtn = document.querySelector(".search button");
        const weather_icon = document.querySelector(".weather_icon");

        async function checkWeather(city) {
            const response = await fetch(apiUrl + city + `&appid=${apiKey}`);

            if(response.status == 404){
               document.querySelector(".error").style.display = "Block";
               document.querySelector(".weather").style.display = "None";
            }
            else{
                var data = await response.json();

            console.log(data);

            document.querySelector(".city").innerHTML = data.name;
            document.querySelector(".temp").innerHTML = Math.round(data.main.temp) + "°c";
            document.querySelector(".humidity").innerHTML = data.main.humidity + "%";
            document.querySelector(".wind").innerHTML = data.wind.speed + "km/h";

           if(data.weather[0].main == "Clouds"){
                weather_icon.src = "images/clouds.png";
            }
            else if(data.weather[0].main == "Clear"){
                weather_icon.src = "images/clear.png";
            }
            else if(data.weather[0].main == "Drizzle"){
                weather_icon.src = "images/drizzle.png";
            }
            else if(data.weather[0].main == "Mist"){
                weather_icon.src = "images/mist.png";
            }
            else if(data.weather[0].main == "Rain"){
                weather_icon.src = "images/rain.png";
            }
            else if(data.weather[0].main == "Snow"){
                weather_icon.src = "images/snow.png";
            }
            
            document.querySelector(".weather").style.display = "block";
            document.querySelector(".error").style.display = "None";

            }

            
        }

    searchBtn.addEventListener("click", ()=>{
         checkWeather(searchBox.value); 
    })  
    
      
    </script>
</body>
</html>
